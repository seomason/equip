<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>장비 현황판</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="dashboard">
      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="logo.png" alt="BEATRO" onerror="this.hidden = true" />
          <div>
            <p class="eyebrow">Equipment Live Board</p>
            <h1>장비 현황판</h1>
          </div>
        </div>
        <div class="top-actions">
          <button id="fullscreenBtn" class="icon-button" type="button" title="전체화면">⛶</button>
          <button id="refreshBtn" class="icon-button" type="button" title="새로고침">↻</button>
          <select id="intervalSelect" class="select" title="갱신 주기">
            <option value="15000">15초</option>
            <option value="30000" selected>30초</option>
            <option value="60000">1분</option>
            <option value="300000">5분</option>
          </select>
        </div>
      </header>

      <section class="status-strip" aria-label="요약">
        <article class="metric">
          <span>전체</span>
          <strong id="totalCount">0</strong>
        </article>
        <article class="metric metric-ready">
          <span>READY</span>
          <strong id="readyCount">0</strong>
        </article>
        <article class="metric metric-out">
          <span>OUT</span>
          <strong id="outCount">0</strong>
        </article>
        <article class="metric metric-repair">
          <span>REPAIR</span>
          <strong id="repairCount">0</strong>
        </article>
      </section>

      <section id="notice" class="notice hidden" role="status"></section>

      <section class="controls">
        <div class="search">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="검색" autocomplete="off" />
        </div>
        <div id="statusFilters" class="segmented"></div>
        <span id="updatedAt" class="updated-at">-</span>
      </section>

      <section id="cardGrid" class="card-grid" aria-label="장비 카드"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
